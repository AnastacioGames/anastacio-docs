# Publica o site no GitHub Pages a cada push na main.
# No GitHub: Settings > Pages > Source = "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # regera o .md único e a versão fatiada para IA (api-ia/) a partir das páginas já geradas;
      # só biblioteca padrão. Assim o que o site publica nunca fica atrás das páginas.
      - run: python3 tools/gerar_md_unico.py && python3 tools/gerar_api_ia.py
        working-directory: .
      - run: npm ci
      - run: npx astro build
      # para o deploy se algum link interno estiver quebrado
      - run: node checar-links.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
